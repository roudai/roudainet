name: setup
description: Node と pnpm をセットアップし、依存関係をインストールする

runs:
  using: composite
  steps:
    # pnpm のバージョンは package.json の packageManager で固定している。setup-node のキャッシュより先に入れる
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: 依存関係をインストール
      run: pnpm install --frozen-lockfile
      shell: bash
