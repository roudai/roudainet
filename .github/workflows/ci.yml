name: ci

# 品質ゲート。Lint、型チェック、ビルド確認までを行い、デプロイはしない(原則 V、VII)
# main への直接の push でも実行する(公開は deploy.yml が並行して行い、ここの結果では止めない)
on:
  pull_request:
    branches: [main, nuxt4-rebuild]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Megaminx PLL のスキルの版(記事のデータを最後に変えたコミット)を求めるため、履歴をすべて取る
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: 静的サイトを生成
        run: pnpm generate

      - name: 出力を検証(CNAME、app-ads.txt、広告なし)
        run: pnpm verify

  # ワークフロー自体の誤りを、main へのマージ前に見つける(deploy.yml は本番でしか動かせないため)
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
