name: ci

# PR の品質ゲート。Lint、型チェック、ビルド確認までを行い、デプロイはしない(原則 V、VII)
on:
  pull_request:
    branches: [main, nuxt4-rebuild]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: 静的サイトを生成
        run: pnpm generate

  # ワークフロー自体の誤りを、main へのマージ前に見つける(deploy.yml は本番でしか動かせないため)
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
