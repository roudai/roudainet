name: deploy

# 本番(GitHub Pages)へ公開するのは main への push のみ(原則 VII)。PR ではデプロイしない(ci.yml)
on:
  push:
    branches: [main]

permissions:
  contents: read

# デプロイが重なった場合は、実行中のものを止めずに順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 静的サイトを生成
        run: pnpm generate

      - name: 出力を検証(CNAME、app-ads.txt、広告なし)
        run: pnpm verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
